<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Lists</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #e8e0c8;
    --card-yellow: #f5f07a;
    --card-pink: #e8b8e0;
    --card-green: #7acc30;
    --card-orange: #f5a820;
    --header-blue: #90d8f0;
    --text-dark: #1a1a1a;
    --shadow: 0 6px 0 rgba(0,0,0,0.18);
    --shadow-hover: 0 8px 0 rgba(0,0,0,0.22);
  }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background-color: var(--bg);
    min-height: 100vh;
    color: var(--text-dark);
  }

  /* ===== HOME PAGE ===== */
  #home {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 60px;
    min-height: 100vh;
  }

  .site-title-wrap {
    background: var(--header-blue);
    border-radius: 24px 24px 50% 50% / 24px 24px 40px 40px;
    padding: 28px 80px 36px;
    margin-bottom: 52px;
    box-shadow: var(--shadow);
    text-align: center;
    width: 100%;
    max-width: 700px;
  }

  .site-title-wrap h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--text-dark);
  }

  .topics-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    max-width: 900px;
  }

  .topic-btn {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    font-weight: 800;
    border: none;
    border-radius: 18px;
    padding: 20px 44px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: 0.5px;
    color: var(--text-dark);
    min-width: 180px;
  }

  .topic-btn:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }

  .topic-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.18);
  }

  .btn-career  { background: var(--card-yellow); }
  .btn-sports  { background: var(--card-green); }
  .btn-culture { background: var(--card-orange); }
  .btn-medicine{ background: var(--card-pink); }

  /* ===== CAREER PAGE ===== */
  #career-page {
    display: none;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .page-header {
    background: var(--card-yellow);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .back-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    background: rgba(0,0,0,0.1);
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    cursor: pointer;
    color: var(--text-dark);
    transition: background 0.15s;
    white-space: nowrap;
  }

  .back-btn:hover { background: rgba(0,0,0,0.18); }

  .page-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 3vw, 2rem);
    color: var(--text-dark);
  }

  .sections-container {
    padding: 40px 24px;
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .section-block {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .section-heading {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.05rem;
    padding: 16px 24px;
    background: var(--header-blue);
    letter-spacing: 0.3px;
    color: var(--text-dark);
  }

  .words-table {
    width: 100%;
    border-collapse: collapse;
  }

  .words-table thead th {
    background: #f0f0f0;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 10px 18px;
    text-align: left;
    color: #555;
    border-bottom: 2px solid #e0e0e0;
  }

  .words-table tbody tr {
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.1s;
  }

  .words-table tbody tr:last-child { border-bottom: none; }
  .words-table tbody tr:hover { background: #fafaf6; }

  .words-table td {
    padding: 13px 18px;
    font-size: 0.95rem;
    vertical-align: top;
  }

  .td-word {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: #1a1a1a;
    min-width: 180px;
  }

  .td-pos {
    font-style: italic;
    color: #888;
    font-size: 0.85rem;
    min-width: 60px;
  }

  .td-translation {
    font-weight: 600;
    color: #333;
    min-width: 180px;
  }

  .td-note {
    color: #777;
    font-size: 0.88rem;
  }

  /* Coming soon pages */
  #sports-page, #culture-page, #medicine-page {
    display: none;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .coming-soon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 20px;
    color: #888;
  }

  .coming-soon-icon {
    font-size: 4rem;
  }

  .coming-soon h2 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    color: #aaa;
  }

  @media (max-width: 600px) {
    .site-title-wrap { padding: 22px 30px 28px; }
    .topic-btn { padding: 18px 30px; min-width: 140px; }
    .words-table thead { display: none; }
    .words-table td { display: block; padding: 6px 16px; }
    .td-word { padding-top: 14px; font-size: 1.05rem; }
    .td-note { padding-bottom: 12px; }
    .td-pos::before { content: 'Part of speech: '; font-style: normal; color: #aaa; font-size: 0.78rem; }
    .td-translation::before { content: '🇷🇺 '; }
  }
</style>
</head>
<body>

<!-- HOME PAGE -->
<div id="home">
  <div class="site-title-wrap">
    <h1>Topics</h1>
  </div>
  <div class="topics-grid">
    <button class="topic-btn btn-career"   onclick="showPage('career')">Career</button>
    <button class="topic-btn btn-medicine" onclick="showPage('medicine')">Medicine</button>
    <button class="topic-btn btn-sports"   onclick="showPage('sports')">Sports</button>
    <button class="topic-btn btn-culture"  onclick="showPage('culture')">Culture</button>
  </div>
</div>

<!-- CAREER PAGE -->
<div id="career-page">
  <div class="page-header">
    <button class="back-btn" onclick="showPage('home')">← Back</button>
    <span class="page-title">Career</span>
  </div>
  <div class="sections-container" id="career-sections"></div>
</div>

<!-- SPORTS PAGE -->
<div id="sports-page">
  <div class="page-header" style="background:var(--card-green);">
    <button class="back-btn" onclick="showPage('home')">← Back</button>
    <span class="page-title">Sports</span>
  </div>
  <div class="sections-container" id="sports-sections"></div>
</div>

<!-- CULTURE PAGE -->
<div id="culture-page">
  <div class="page-header" style="background:var(--card-orange);">
    <button class="back-btn" onclick="showPage('home')">← Back</button>
    <span class="page-title">Culture</span>
  </div>
  <div class="coming-soon">
    <div class="coming-soon-icon">🎭</div>
    <h2>Coming soon...</h2>
  </div>
</div>

<!-- MEDICINE PAGE -->
<div id="medicine-page">
  <div class="page-header" style="background:var(--card-pink);">
    <button class="back-btn" onclick="showPage('home')">← Back</button>
    <span class="page-title">Medicine</span>
  </div>
  <div class="sections-container" id="medicine-sections"></div>
</div>

function buildCareerPage() {
  const container = document.getElementById('career-sections');
  if (container.children.length > 0) return; // already built
  for (const [section, words] of Object.entries(CAREER_DATA)) {
    const block = document.createElement('div');
    block.className = 'section-block';
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = section;
    block.appendChild(heading);
    const table = document.createElement('table');
    table.className = 'words-table';
    table.innerHTML = `<thead><tr>
      <th>Word</th><th>POS</th><th>Translation</th><th>Note</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    words.forEach(w => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-word">${w.word}</td>
        <td class="td-pos">${w.pos}</td>
        <td class="td-translation">${w.translation}</td>
        <td class="td-note">${w.note}</td>
      `;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    block.appendChild(table);
    container.appendChild(block);
  }
}

function buildMedicinePage() {
  const container = document.getElementById('medicine-sections');
  if (container.children.length > 0) return;
  for (const [section, words] of Object.entries(MEDICINE_DATA)) {
    const block = document.createElement('div');
    block.className = 'section-block';
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = section;
    block.appendChild(heading);
    const table = document.createElement('table');
    table.className = 'words-table';
    table.innerHTML = `<thead><tr>
      <th>Word</th><th>POS</th><th>Translation</th><th>Note</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    words.forEach(w => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-word">${w.word}</td>
        <td class="td-pos">${w.pos}</td>
        <td class="td-translation">${w.translation}</td>
        <td class="td-note">${w.note}</td>

function buildSportsPage() {
  const container = document.getElementById('sports-sections');
  if (container.children.length > 0) return;
  for (const [section, words] of Object.entries(SPORTS_DATA)) {
    const block = document.createElement('div');
    block.className = 'section-block';
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.style.background = 'var(--card-green)';
    heading.textContent = section;
    block.appendChild(heading);
    const table = document.createElement('table');
    table.className = 'words-table';
    table.innerHTML = `<thead><tr>
      <th>Word</th><th>POS</th><th>Translation</th><th>Note</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    words.forEach(w => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-word">${w.word}</td>
        <td class="td-pos">${w.pos}</td>
        <td class="td-translation">${w.translation}</td>
        <td class="td-note">${w.note}</td>
      `;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    block.appendChild(table);
    container.appendChild(block);
  }
}

function showPage(page) {
  ['home', 'career-page', 'sports-page', 'culture-page', 'medicine-page'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  if (page === 'home') {
    document.getElementById('home').style.display = 'flex';
  } else {
    if (page === 'career') buildCareerPage();
    if (page === 'medicine') buildMedicinePage();
    if (page === 'sports') buildSportsPage();
    document.getElementById(page + '-page').style.display = 'block';
    window.scrollTo(0, 0);
  }
}
</script>
</body>
